services:
  mysql:
    image: mysql:8.0
    container_name: dgmc_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dgmc_meals
      MYSQL_USER: dgmc_user
      MYSQL_PASSWORD: dgmc_password
    ports:
      - "3311:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
