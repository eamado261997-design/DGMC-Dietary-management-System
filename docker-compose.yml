services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dgmc-app:latest
    container_name: dgmc_app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:3000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-dgmc_dietary_secret_jwt_key_9501}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-dgmc_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-dgmc_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-dgmc_meals}
      - REDIS_URL=redis://cache:6379
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    volumes:
      # Persistent storage for local file backups, SQLite mirrors & application logs
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dgmc_network

  db:
    image: mysql:8.0
    container_name: dgmc_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dgmc_meals}
      MYSQL_USER: ${MYSQL_USER:-dgmc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dgmc_password}
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
      - "3311:3306"
    volumes:
      # Persistent named volume ensuring database records survive container destruction
      - db_data:/var/lib/mysql
      # Auto-executes DDL schemas and default seeds on initial container initialization
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dgmc_network

  cache:
    image: redis:7-alpine
    container_name: dgmc_cache
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      # Append-only file persistence for cache and session keys
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dgmc_network

volumes:
  db_data:
    name: dgmc_db_data
  cache_data:
    name: dgmc_cache_data
  app_data:
    name: dgmc_app_data
  app_logs:
    name: dgmc_app_logs

networks:
  dgmc_network:
    name: dgmc_network
    driver: bridge
