services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dgmc-app:local
    container_name: dgmc_app
    restart: always
    ports:
      - "80:3000"
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=dgmc_mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=dgmc_user
      - MYSQL_PASSWORD=dgmc_password
      - MYSQL_DATABASE=dgmc_meals
      - REDIS_URL=redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: mysql:8.0
    container_name: dgmc_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dgmc_meals
      MYSQL_USER: dgmc_user
      MYSQL_PASSWORD: dgmc_password
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
      - "3311:3306"
    networks:
      default:
        aliases:
          - dgmc_mysql
          - db
          - dgmc_db
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword || mysqladmin ping -h localhost -u root -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  cache:
    image: redis:7
    container_name: dgmc_cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  cache_data:
